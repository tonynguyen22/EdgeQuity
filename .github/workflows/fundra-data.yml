name: Refresh Fundra static data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FUNDRA_MAX_TICKERS: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Fundra static data
        run: npm run fundra:data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit and push updated Fundra data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fundra
          if git diff --cached --quiet; then
            echo "No Fundra static data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Fundra static data"
          git push
